name: backend-workflow

on:
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'alpine'

      - name: "grants permission"
        run: chmod +x gradlew

      - name: "Build with gradle"
        run: ./gradlew build