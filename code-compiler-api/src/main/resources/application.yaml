spring:
  application:
    name: backend
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://localhost:5432/backend
  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    clear-checksums: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
server:
  port: ${PORT:8090}

springdoc:
  swagger-ui:
    url: /v3/api-docs

broker:
  queue: code-processor
  exchange: rabbit_mq_exchange
  key: rabbit_mq_r_key
  login:
    username: guest
    password: guest
    address: rabbitmq # localhost or rabbitmq
    port: 5672

logging:
  level:
    http.server.backend: trace