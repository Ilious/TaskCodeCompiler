spring:
  application:
    name: backend

  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5434/${DB:backend}}

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    clear-checksums: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8090}

springdoc:
  swagger-ui:
    url: /v3/api-docs

broker:
  queue: code-processor
  exchange: rabbit_mq_exchange
  key: rabbit_mq_r_key
  login:
    username: guest
    password: guest
    address: ${BROKER_ADDRESS:localhost}
    port: 5672

app:
  session:
    ttl-minutes: 10
    clean-interval-hours: 1

logging:
  level:
    http.server.backend: trace